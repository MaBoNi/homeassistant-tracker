<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#005b96">
    <title>GPS Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />  <!-- Leaflet CSS -->
</head>
<body>
    <!-- Login screen (issue #115), shown when GET /auth/me returns 401 -->
    <section id="login-view" class="login-view" hidden>
        <form id="login-form" class="panel login-form">
            <h1>GPS Tracker</h1>
            <label for="login-username">Username</label>
            <input type="text" id="login-username" autocomplete="username" required>
            <label for="login-password">Password</label>
            <input type="password" id="login-password" autocomplete="current-password" required>
            <button type="submit" id="login-submit">Log in</button>
            <p id="login-error" class="form-error" role="alert"></p>
        </form>
    </section>

    <div class="container" id="app-view" hidden>
        <header class="topbar">
            <h1>Home Assistant History Data Tracker</h1>
            <div class="topbar-user">
                <span id="current-username"></span>
                <span id="current-role" class="role-badge"></span>
                <button type="button" id="users-toggle" class="secondary" hidden>Users</button>
                <button type="button" id="logout-btn" class="secondary">Log out</button>
            </div>
        </header>

        <!-- Admin-only account management (issue #115) -->
        <section id="users-panel" class="panel" hidden>
            <h2>Users</h2>
            <table id="users-table">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Tracked person</th>
                        <th>Active</th>
                        <th>Last login</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <form id="invite-form" class="invite-form">
                <h3>Add user</h3>
                <input type="text" id="invite-username" placeholder="Username" required pattern="[A-Za-z0-9_.\-]{1,64}">
                <input type="password" id="invite-password" placeholder="Password (12+ characters)" required minlength="12" autocomplete="new-password">
                <select id="invite-role">
                    <option value="user">user</option>
                    <option value="readonly">readonly</option>
                    <option value="admin">admin</option>
                </select>
                <input type="text" id="invite-person" placeholder="Tracked person" list="tracked-people">
                <button type="submit">Add</button>
            </form>
            <datalist id="tracked-people"></datalist>
            <p id="users-message" class="form-message" role="status"></p>
        </section>

        <div class="selectors">
            <label for="user-select">Select User:</label>
            <select id="user-select">
                <!-- Users will be populated here dynamically -->
            </select>

            <label for="device-select">Device:</label>
            <select id="device-select">
                <option value="">All devices</option>
            </select>

            <label for="time-select">Select Time Range:</label>
            <select id="time-select">
                <option value="last_hour">Last Hour</option>
                <option value="last_2_hours">Last 2 Hours</option>
                <option value="last_3_hours" selected>Last 3 Hours</option>
                <option value="last_6_hours">Last 6 Hours</option>
                <option value="last_day">Last Day</option>
                <option value="last_7_days">Last 7 Days</option>
                <option value="last_30_days">Last 1 Month</option>
                <option value="custom">Custom date range…</option>
            </select>

            <div class="date-range" id="date-range" hidden>
                <label for="start-date">From:</label>
                <input type="date" id="start-date">
                <label for="end-date">To:</label>
                <input type="date" id="end-date">
                <button type="button" id="apply-date-range">Apply</button>
            </div>

            <div class="time-info">
                <div id="local-time"></div>
                <div id="last-updated"></div>  <!-- Last updated time display -->
            </div>

        </div>

        <!-- Map container -->
        <div id="map" style="height: 400px;"></div>

        <!-- Playback controls for animated route replay (issue #18) -->
        <div class="playback-controls">
            <button type="button" id="play-btn" disabled>▶ Play</button>
            <button type="button" id="pause-btn" disabled>⏸ Pause</button>
            <label for="speed-select">Speed:</label>
            <select id="speed-select">
                <option value="1">1×</option>
                <option value="2" selected>2×</option>
                <option value="4">4×</option>
            </select>
        </div>

        <!-- Per-user stats panel (issue #22). Hidden until a user is picked. -->
        <div id="stats-panel" class="stats-panel" hidden>
            <div class="stats-grid">
                <div class="stat">
                    <div class="stat-label">Total distance</div>
                    <div class="stat-value" id="stat-distance">—</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Avg speed</div>
                    <div class="stat-value" id="stat-speed">—</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Points</div>
                    <div class="stat-value" id="stat-points">—</div>
                </div>
            </div>
            <canvas id="stats-chart" height="120"></canvas>
        </div>

        <!-- Export / delete for the selected person (GDPR, issue #75). Hidden for readonly. -->
        <div id="data-actions" class="data-actions" hidden>
            <a id="export-json" class="button-link" href="#" download>Export JSON</a>
            <a id="export-csv" class="button-link" href="#" download>Export CSV</a>
            <button type="button" id="delete-data" class="danger">Delete all data…</button>
        </div>

        <div id="error"></div>  <!-- Error message will appear here -->

        <table id="gps-data-table">
            <thead>
                <tr>
                    <th>User</th>
                    <th>Device</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                    <th>Timestamp</th>
                    <th>Accuracy</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be inserted here dynamically -->
            </tbody>
        </table>
    </div>


    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script> <!-- Leaflet JS -->
    <script src="script.js"></script>
</body>
</html>
