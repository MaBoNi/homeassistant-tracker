services:
  backend:
    build: ./backend
    container_name: homeassistant-tracker-backend
    restart: unless-stopped
    ports:
      - "5171:5000"  # Backend API port
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - HA_API_URL=${HA_API_URL}
      - HA_TOKEN=${HA_TOKEN}
      - HA_USERS=${HA_USERS}
      - DROP_DB_ON_START=${DROP_DB_ON_START}
      - TRACKER_APP_TOKEN=${TRACKER_APP_TOKEN}
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: homeassistant-tracker-frontend
    restart: unless-stopped
    ports:
      - "5172:8080"  # Frontend app port (non-root nginx runs on 8080)
    environment:
      - TRACKER_APP_TOKEN=${TRACKER_APP_TOKEN}
      - BACKEND_API_URL=${BACKEND_API_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      retries: 5

  db:
    image: postgres:13
    container_name: homeassistant-tracker-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

volumes:
  postgres_data: