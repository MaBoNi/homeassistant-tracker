services:
  backend:
    build: ./backend
    container_name: homeassistant-tracker-backend
    restart: unless-stopped
    ports:
      - "5171:5000"  # Backend API port
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - HA_API_URL=${HA_API_URL}
      - HA_TOKEN=${HA_TOKEN}
      - HA_USERS=${HA_USERS}
      - DROP_DB_ON_START=${DROP_DB_ON_START}
      - TRACKER_APP_TOKEN=${TRACKER_APP_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: homeassistant-tracker-frontend
    restart: unless-stopped
    ports:
      - "5172:8080"  # Frontend app port (non-root nginx runs on 8080)
    environment:
      - TRACKER_APP_TOKEN=${TRACKER_APP_TOKEN}
      - BACKEND_API_URL=${BACKEND_API_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: homeassistant-tracker-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  loki:
    image: grafana/loki:3.2.0
    container_name: tracker-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    profiles: [observability]
    volumes:
      - loki_data:/loki
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro

  promtail:
    image: grafana/promtail:3.2.0
    container_name: tracker-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    profiles: [observability]
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tracker-grafana
    restart: unless-stopped
    profiles: [observability]
    environment:
      # Set GRAFANA_ADMIN_PASSWORD in your .env (see .env.example) before
      # running with --profile observability. Default below is intentionally
      # weak so `docker compose up` without the profile keeps working.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme-please}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=alertingApiServer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [loki]

volumes:
  postgres_data:
  loki_data:
  grafana_data: